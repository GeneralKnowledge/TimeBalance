[project]
name = "mpe"
version = "0.0.1"
description = "Market Prediction Engine: paper-trading research lab for Timestral and baselines"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "torch>=2.4",
    "timestral",
    "huggingface_hub>=0.23",
    "psutil>=5.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyyaml>=6",
    "yfinance>=0.2.50",
    "exchange-calendars>=4.5",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Decision-model experiment (mpe decide). Optional: the forecasting pipeline never imports it.
laya = ["laya==0.4.22"]

[project.scripts]
mpe = "mpe.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpe"]

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }
# CUDA 12.6 wheels are the newest PyTorch builds that still ship sm_61 (Pascal / GTX 1060)
# kernels; the default PyPI wheels (CUDA 12.8+) dropped Pascal. They also run on CPU.
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "weights: needs downloaded Timestral weights (skipped by default)",
    "gpu: needs a CUDA GPU (skipped by default)",
    "network: needs network access (skipped by default)",
]
addopts = "-m 'not weights and not gpu and not network'"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]
